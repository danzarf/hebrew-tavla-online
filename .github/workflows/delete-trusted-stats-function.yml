name: Delete Trusted Stats Function

on:
  workflow_dispatch:
    inputs:
      confirm_function_name:
        description: "Type onMatchResultSubmissionCreated to confirm deletion"
        required: true
        type: string

jobs:
  delete:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FIREBASE_PROJECT_ID: hebrew-tavla-online
      TRUSTED_STATS_FUNCTION_NAME: onMatchResultSubmissionCreated
      TRUSTED_STATS_FUNCTION_REGION: europe-west1

    steps:
      - name: Validate confirmation input
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm_function_name }}" != "$TRUSTED_STATS_FUNCTION_NAME" ]; then
            echo "::error::Confirmation must exactly match $TRUSTED_STATS_FUNCTION_NAME."
            exit 1
          fi

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HEBREW_TAVLA_ONLINE }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing FIREBASE_SERVICE_ACCOUNT_HEBREW_TAVLA_ONLINE secret." >&2
            exit 1
          fi
          FIREBASE_SERVICE_ACCOUNT_FILE="$RUNNER_TEMP/firebase-service-account.json"
          echo "FIREBASE_SERVICE_ACCOUNT_FILE=$FIREBASE_SERVICE_ACCOUNT_FILE" >> "$GITHUB_ENV"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$FIREBASE_SERVICE_ACCOUNT_FILE"
          chmod 600 "$FIREBASE_SERVICE_ACCOUNT_FILE"

      - name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HEBREW_TAVLA_ONLINE }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Inspect target function before deletion
        run: |
          set -euo pipefail
          gcloud config set project "$FIREBASE_PROJECT_ID"
          gcloud functions describe "$TRUSTED_STATS_FUNCTION_NAME" \
            --gen2 \
            --region "$TRUSTED_STATS_FUNCTION_REGION" \
            --project "$FIREBASE_PROJECT_ID" \
            --format="yaml(name,state,environment,serviceConfig.uri,eventTrigger.eventType,eventTrigger.triggerRegion)" || {
              echo "::warning::Could not describe $TRUSTED_STATS_FUNCTION_NAME in $TRUSTED_STATS_FUNCTION_REGION. The delete step will still verify whether Firebase CLI can find it."
            }

      - name: Delete trusted stats function only
        run: |
          set -euo pipefail
          GOOGLE_APPLICATION_CREDENTIALS="$FIREBASE_SERVICE_ACCOUNT_FILE" npx firebase-tools@latest functions:delete "$TRUSTED_STATS_FUNCTION_NAME" \
            --project "$FIREBASE_PROJECT_ID" \
            --region "$TRUSTED_STATS_FUNCTION_REGION" \
            --force

      - name: Remove Firebase credentials
        if: always()
        run: rm -f "$FIREBASE_SERVICE_ACCOUNT_FILE"
