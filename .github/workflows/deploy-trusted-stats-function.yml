name: Deploy Trusted Stats Function

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FIREBASE_PROJECT_ID: hebrew-tavla-online
      FIREBASE_PROJECT_NUMBER: "917406478506"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm install

      - name: Install functions dependencies
        run: npm install --prefix functions

      - name: Run root tests
        run: npm test

      - name: Run functions static check
        run: npm run functions:check

      - name: Run functions tests
        run: npm run functions:test

      - name: Check whitespace errors
        run: git diff --check

      - name: Prepare Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HEBREW_TAVLA_ONLINE }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing FIREBASE_SERVICE_ACCOUNT_HEBREW_TAVLA_ONLINE secret." >&2
            exit 1
          fi
          FIREBASE_SERVICE_ACCOUNT_FILE="$RUNNER_TEMP/firebase-service-account.json"
          echo "FIREBASE_SERVICE_ACCOUNT_FILE=$FIREBASE_SERVICE_ACCOUNT_FILE" >> "$GITHUB_ENV"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$FIREBASE_SERVICE_ACCOUNT_FILE"
          chmod 600 "$FIREBASE_SERVICE_ACCOUNT_FILE"

      - name: Authenticate Google Cloud preflight
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HEBREW_TAVLA_ONLINE }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Check required Google Cloud APIs
        run: |
          set -euo pipefail
          gcloud config set project "$FIREBASE_PROJECT_ID"

          required_apis=(
            artifactregistry.googleapis.com
            cloudbilling.googleapis.com
            cloudbuild.googleapis.com
            cloudfunctions.googleapis.com
            eventarc.googleapis.com
            firebase.googleapis.com
            firebasedatabase.googleapis.com
            pubsub.googleapis.com
            run.googleapis.com
            serviceusage.googleapis.com
          )

          if ! enabled_apis="$(gcloud services list --enabled --project "$FIREBASE_PROJECT_ID" --format="value(config.name)" 2>&1)"; then
            echo "::error::Could not list enabled APIs. Grant roles/serviceusage.serviceUsageViewer or roles/serviceusage.serviceUsageAdmin to the deploy service account."
            echo "$enabled_apis"
            exit 1
          fi

          missing_apis=()
          for api in "${required_apis[@]}"; do
            if printf '%s\n' "$enabled_apis" | grep -qx "$api"; then
              echo "API enabled: $api"
            else
              missing_apis+=("$api")
            fi
          done

          if [ "${#missing_apis[@]}" -gt 0 ]; then
            echo "::error::Missing required APIs for Firebase Functions Gen 2 deploy:"
            printf ' - %s\n' "${missing_apis[@]}"
            echo "::error::Enable these APIs in Google Cloud Console, or grant roles/serviceusage.serviceUsageAdmin to the deploy service account so the Firebase CLI can enable required APIs."
            exit 1
          fi

      - name: Check Cloud Build service account role
        run: |
          set -euo pipefail
          build_service_account="${FIREBASE_PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
          required_member="serviceAccount:${build_service_account}"
          required_role="roles/cloudbuild.builds.builder"

          if ! project_policy="$(gcloud projects get-iam-policy "$FIREBASE_PROJECT_ID" --format=json 2>&1)"; then
            echo "::warning::Could not inspect IAM policy. If deploy fails during build, grant ${required_role} to ${build_service_account}."
            echo "$project_policy"
            exit 0
          fi

          if ! printf '%s' "$project_policy" | node -e '
            const fs = require("node:fs");
            const policy = JSON.parse(fs.readFileSync(0, "utf8"));
            const role = process.env.REQUIRED_ROLE;
            const member = process.env.REQUIRED_MEMBER;
            const binding = (policy.bindings || []).find((item) => item.role === role && (item.members || []).includes(member));
            process.exit(binding ? 0 : 1);
          '; then
            echo "::error::Missing ${required_role} on build service account ${build_service_account}."
            echo "::error::Grant this role in Google Cloud IAM, then rerun this workflow."
            exit 1
          fi

          echo "Build service account has ${required_role}: ${build_service_account}"
        env:
          REQUIRED_MEMBER: serviceAccount:917406478506-compute@developer.gserviceaccount.com
          REQUIRED_ROLE: roles/cloudbuild.builds.builder

      - name: Deploy onMatchResultSubmissionCreated only
        run: GOOGLE_APPLICATION_CREDENTIALS="$FIREBASE_SERVICE_ACCOUNT_FILE" npx firebase-tools@latest deploy --project "$FIREBASE_PROJECT_ID" --only functions:onMatchResultSubmissionCreated --force

      - name: Remove Firebase credentials
        if: always()
        run: rm -f "$FIREBASE_SERVICE_ACCOUNT_FILE"
